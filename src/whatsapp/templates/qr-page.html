<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión WhatsApp - Inmobiliaria Formosa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #25D366;
            --primary-dark: #128C7E;
            --secondary: #667eea;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            padding: 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            margin-bottom: 32px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        h1 {
            color: #1f2937;
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 0;
            font-size: 16px;
            font-weight: 400;
        }
        
        .qr-container {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border-radius: 20px;
            padding: 40px;
            margin: 32px 0;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #e5e7eb;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .qr-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .qr-container.has-qr {
            border-color: var(--primary);
            border-style: solid;
            background: #ffffff;
        }
        
        .qr-image {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            animation: fadeIn 0.5s ease-out;
            position: relative;
            z-index: 1;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .status {
            margin-top: 24px;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .status.waiting {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
            border: 1px solid #fbbf24;
        }
        
        .status.ready {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
            border: 1px solid var(--success);
        }
        
        .status.error {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
            border: 1px solid var(--error);
        }
        
        .loading {
            display: inline-block;
            width: 60px;
            height: 60px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
            z-index: 1;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            color: #6b7280;
            font-size: 15px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        
        .instructions {
            margin-top: 24px;
            background: #f9fafb;
            border-radius: 16px;
            padding: 24px;
            text-align: left;
            animation: slideDown 0.4s ease-out;
        }
        
        .instructions-title {
            color: #1f2937;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .instructions-list {
            list-style: none;
            counter-reset: step-counter;
        }
        
        .instructions-list li {
            counter-increment: step-counter;
            margin: 12px 0;
            padding-left: 36px;
            position: relative;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .instructions-list li::before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 0;
            background: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        
        .success-container {
            text-align: center;
            padding: 40px 20px;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 48px;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            animation: scaleIn 0.5s ease-out;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        .success-title {
            color: var(--success);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .success-text {
            color: #6b7280;
            font-size: 15px;
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 26px;
            }
            
            .qr-container {
                padding: 24px;
                min-height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📱</div>
            <h1>Iniciar Sesión WhatsApp</h1>
            <p class="subtitle">Inmobiliaria Formosa - Chatbot</p>
        </div>
        
        <div class="qr-container" id="qrContainer">
            <div class="loading" id="loading"></div>
            <p class="loading-text" id="loadingText">Generando código QR...</p>
        </div>
        
        <div class="status" id="status" style="display: none;"></div>
        
        <div class="instructions" id="instructions" style="display: none;">
            <div class="instructions-title">
                <span>📋</span>
                <span>Instrucciones</span>
            </div>
            <ol class="instructions-list">
                <li>Abre WhatsApp en tu teléfono móvil</li>
                <li>Ve a Configuración → Dispositivos vinculados</li>
                <li>Toca "Vincular un dispositivo"</li>
                <li>Escanea el código QR que aparece arriba</li>
            </ol>
        </div>
    </div>

    <script>
        let pollInterval;
        let lastQR = null;
        let isConnected = false;

        async function fetchQR() {
            try {
                const response = await fetch('/api/qr');
                const data = await response.json();
                
                const qrContainer = document.getElementById('qrContainer');
                const status = document.getElementById('status');
                const instructions = document.getElementById('instructions');
                const loading = document.getElementById('loading');
                const loadingText = document.getElementById('loadingText');
                
                // Si está conectado, mostrar pantalla de éxito
                if (data.isReady && !isConnected) {
                    isConnected = true;
                    loading.style.display = 'none';
                    loadingText.style.display = 'none';
                    qrContainer.className = 'qr-container';
                    qrContainer.innerHTML = `
                        <div class="success-container">
                            <div class="success-icon">✅</div>
                            <div class="success-title">¡Conectado!</div>
                            <div class="success-text">WhatsApp está listo para recibir mensajes</div>
                        </div>
                    `;
                    status.className = 'status ready';
                    status.innerHTML = '<span>✅</span><span>WhatsApp conectado exitosamente</span>';
                    status.style.display = 'flex';
                    instructions.style.display = 'none';
                    
                    // Detener el polling
                    if (pollInterval) {
                        clearInterval(pollInterval);
                    }
                    return;
                }
                
                // Si no está conectado, mostrar QR
                if (!data.isReady) {
                    isConnected = false;
                    
                    if (data.qrImage && data.qrImage !== lastQR) {
                        // Nuevo QR disponible
                        lastQR = data.qrImage;
                        loading.style.display = 'none';
                        loadingText.style.display = 'none';
                        qrContainer.className = 'qr-container has-qr';
                        qrContainer.innerHTML = `<img src="${data.qrImage}" alt="QR Code" class="qr-image" />`;
                        status.className = 'status waiting';
                        status.innerHTML = '<span>⏳</span><span>Escanea el código QR con tu WhatsApp</span>';
                        status.style.display = 'flex';
                        instructions.style.display = 'block';
                    } else if (!data.qrImage) {
                        // Esperando QR
                        loading.style.display = 'block';
                        loadingText.style.display = 'block';
                        qrContainer.className = 'qr-container';
                        qrContainer.innerHTML = `
                            <div class="loading"></div>
                            <p class="loading-text">Generando código QR...</p>
                        `;
                        status.style.display = 'none';
                        instructions.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Error al obtener QR:', error);
                const qrContainer = document.getElementById('qrContainer');
                const status = document.getElementById('status');
                loading.style.display = 'none';
                loadingText.style.display = 'none';
                qrContainer.className = 'qr-container';
                qrContainer.innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 64px; margin-bottom: 16px;">❌</div>
                        <p style="color: #6b7280; font-size: 15px;">Error al cargar el código QR</p>
                    </div>
                `;
                status.className = 'status error';
                status.innerHTML = '<span>❌</span><span>Error de conexión. Recargando...</span>';
                status.style.display = 'flex';
                
                // Reintentar después de 3 segundos
                setTimeout(() => {
                    fetchQR();
                }, 3000);
            }
        }

        // Iniciar polling cada 2 segundos
        fetchQR();
        pollInterval = setInterval(fetchQR, 2000);
        
        // Limpiar intervalo al cerrar la página
        window.addEventListener('beforeunload', () => {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });
    </script>
</body>
</html>
